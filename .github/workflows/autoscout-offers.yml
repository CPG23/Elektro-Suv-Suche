name: Update AutoScout offers

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/fetch-autoscout-offers.js"
      - ".github/workflows/autoscout-offers.yml"

permissions:
  contents: write

jobs:
  update-offers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install browser tools
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Fetch AutoScout offers
        run: node scripts/fetch-autoscout-offers.js

      - name: Commit updated offers
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update AutoScout offers
          file_pattern: autoscout-offers.json
