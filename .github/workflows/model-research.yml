name: Modellrecherche aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches: ["main"]
    paths:
      - "scripts/research-models.js"
      - ".github/workflows/model-research.yml"
      - "data.json"

permissions:
  contents: write

jobs:
  research-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Search for model announcements
        run: node scripts/research-models.js

      - name: Commit model candidates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model-candidates.json

          if git diff --cached --quiet; then
            echo "Keine neuen Modellkandidaten zu speichern."
            exit 0
          fi

          git commit -m "Update model candidates"
          git pull --rebase origin main
          git push
